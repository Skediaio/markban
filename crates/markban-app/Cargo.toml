[package]
name = "markban-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only Dioxus fullstack viewer for a markban board"

[dependencies]
dioxus = { version = "=0.7.10", features = ["fullstack"] }
markban-core = { path = "../markban-core" }
serde.workspace = true

# Server only.
tokio = { version = "1", features = ["sync", "time", "rt", "macros"], optional = true }
notify-debouncer-full = { version = "0.8", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
ammonia = { version = "4", optional = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "html", "parsing", "regex-fancy"], optional = true }
markban-server = { path = "../markban-server", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
getrandom = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }
form_urlencoded = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[features]
default = ["server"]
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:notify-debouncer-full",
    "dep:pulldown-cmark",
    "dep:ammonia",
    "dep:syntect",
    "dep:markban-server",
    "dep:sha2",
    "dep:subtle",
    "dep:getrandom",
    "dep:base64",
    "dep:form_urlencoded",
]

[lints]
workspace = true
