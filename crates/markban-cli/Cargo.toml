[package]
name = "markban-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The markban command line: a thin layer over markban-core."

[[bin]]
name = "markban"
path = "src/main.rs"

[dependencies]
markban-core = { path = "../markban-core" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lints]
workspace = true
